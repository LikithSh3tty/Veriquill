[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veriquill"
version = "0.1.0"
description = "Evidence-first hiring intelligence: portfolio authenticity and code evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "radon>=6.0",
    "bandit>=1.7",
    "ruff>=0.5",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# The two model passes are optional, so the SDK behind them is too. A plain
# install gives the deterministic tool, which is the product; `veriquill[llm]`
# adds claim refinement and design review, both still off until switched on.
llm = ["anthropic>=0.40"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "anthropic>=0.40",
]

[project.scripts]
veriquill = "veriquill.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["veriquill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
