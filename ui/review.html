    <!--
      THESIS: A review screen that shows how far apart the evidence actually places
      candidates, and refuses the dashboard default of stat tiles and a single score.
      OWN-WORLD: Same document ground as the public page. Ink is what the machine
      measured; blue is what a human decided, used for nothing else. One sans for the
      interface, mono for every number. Rules and panels, no cards, no display face.
      STORY: The reviewer sees who the evidence separates, opens a candidate, reads
      what each dimension actually read, dismisses or confirms a flag with a reason,
      and approves a revision that then becomes exportable.
      FIRST VIEWPORT: Sticky gate strip stating pending or approved and what that
      blocks; the shared-axis cohort left; the candidate panel right.
      FORM: Shared-axis comparison with a margin panel, first of the ordered list.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the
      finish review, the verdict, DESIGN.md, and every shipping raster carrying its
      provenance
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
