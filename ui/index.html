      THESIS: This page argues with the artifact, not with adjectives. It opens on a
      real cohort where three candidates overlap and the tool refuses to order them,

      OWN-WORLD: Cool document ground (#e9edf0) with a lifted panel, near-black ink,
      one blue reserved for human decisions. Bricolage Grotesque set large and tight
      against Public Sans body and JetBrains Mono data. Rules and tables, no cards.
      STORY: A hiring lead sees that the tool reports uncertainty instead of hiding it,
      reads what it measures and what it refuses to do, and opens the review screen.
      FIRST VIEWPORT: Masthead rule; a three-line display claim; immediately under it
      the specimen cohort with its axis, bands, and tie note. Primary action sits in
      the masthead and again at the close.
      FORM: Specimen-led argument, first of the ordered list.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the
      finish review, the verdict, DESIGN.md, and every shipping raster carrying its
